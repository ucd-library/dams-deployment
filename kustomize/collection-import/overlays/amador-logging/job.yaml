apiVersion: batch/v1
kind: Job
metadata:
  name: import-amador-logging
spec:
  template:
    spec:
      containers:
      - name: importer
        env:
          - name: COLLECTION_NAME
            value: amador-logging
        volumeMounts:
        - name: import-volume
          mountPath: /data
      volumes:
      - name: import-volume
        persistentVolumeClaim:
          claimName: import-amador-logging-volume-claim