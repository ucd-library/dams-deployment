apiVersion: batch/v1
kind: Job
metadata:
  name: import-merry-edwards
spec:
  template:
    spec:
      containers:
      - name: importer
        env:
          - name: COLLECTION_NAME
            value: merry-edwards
        volumeMounts:
        - name: import-volume
          mountPath: /data
      volumes:
      - name: import-volume
        persistentVolumeClaim:
          claimName: import-merry-edwards-volume-claim