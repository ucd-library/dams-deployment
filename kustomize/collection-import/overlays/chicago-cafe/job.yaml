apiVersion: batch/v1
kind: Job
metadata:
  name: import-chicago-cafe
spec:
  template:
    spec:
      containers:
      - name: importer
        env:
          - name: COLLECTION_NAME
            value: chicago-cafe
        volumeMounts:
        - name: import-volume
          mountPath: /data
      volumes:
      - name: import-volume
        persistentVolumeClaim:
          claimName: import-chicago-cafe-volume-claim