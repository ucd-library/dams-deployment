apiVersion: v1
kind: ConfigMap
metadata:
  name: dams-env-config
data:
  WORKFLOW_ENV: dev
  IMAGE_UTILS_SERVICE_URL: https://dams-image-utils-dev-834298256607.us-west1.run.app
  IMAGE_UTILS_SERVICE_CONTAINER: us-west1-docker.pkg.dev/ucdlib-dams/pub/dams-image-utils:2.8.0
  K8S_ENABLED: 'true'
  K8S_NAMESPACE: digital-dev
  K8S_PLATFORM: microk8s
  K8S_IMPORT_JOB_INTENDED_FOR: digital-dev-backend
  K8S_IMPORT_STORAGE_CLASS: nfs-csi
  K8S_COLLECTION_IMPORT_IMAGE: us-west1-docker.pkg.dev/ucdlib-dams/pub/dams-base-service:2.8.0

  # CaskFS access (docs/PORT-PLAN.md Phase 1, interim track) - cross-namespace
  # call to argonath-prod's real cask service, no dedicated argonath-dev
  # namespace exists yet (tracked as an external dependency on argonath-deployment).
  # CASK_USER must be granted a CaskFS-side role scoped to gold/digital-dev
  # only - see cmds/provision-cask-dev-access.sh, run against argonath-prod.
  CASK_URL: http://cask.argonath-prod.svc.cluster.local:3001
  CASK_PATH_PREFIX: /cask
  CASK_USER: dams-dev-service
  USE_DATE_RANGE_FIELDS: 'true'